name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Version consistency (VERSION / core/version.py / pyproject.toml)
        run: python scripts/check_version.py
      - name: Lint (syntax + bugbear + async blocking)
        run: ruff check core executor gateway scripts tests
      - name: Type check (advisory, non-blocking)
        run: mypy core executor gateway || true
      - name: Tests + coverage gate
        run: pytest -q --cov=core --cov-report=term --cov-fail-under=70
      - name: Dependency audit (production deps)
        run: pip-audit -r requirements.txt -s osv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (oxlint, 0 errors required)
        run: npx oxlint src
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck + build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (single-port console included)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zhike-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name zhike-ci -p 8010:8010 \
            -e ADMIN_TOKEN=ci-admin-token -e CHANNEL_TOKEN=ci-channel-token \
            zhike-core:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8010/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8010/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8010/readyz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8010/ | grep -qi '<div id="root">'
          docker logs zhike-ci | tail -30
          docker rm -f zhike-ci

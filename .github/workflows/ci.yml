name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pip-audit
      - name: Lint (real errors only)
        run: ruff check core executor gateway scripts --select E9,F63,F7,F82,F401,F841
      - name: Tests + coverage gate
        run: pytest -q --cov=core --cov-report=term --cov-fail-under=70
      - name: Dependency audit (production deps)
        run: pip-audit -r requirements.txt -s osv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck + build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

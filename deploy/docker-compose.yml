services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: zhike-napcat
    environment:
      - ACCOUNT=${NAPCAT_QQ:-}
      - TZ=Asia/Shanghai
    # WebUI 仅绑本机：扫码登录用（SSH 隧道或本机浏览器访问）。
    # 3001（OneBot WS）不对外发布——gateway 走 compose 内网直连，防公网裸奔。
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat_data:/app/napcat
    restart: unless-stopped

  core:
    # 构建上下文必须是仓库根：Dockerfile 在根目录，且需要拷 core/ gateway/ frontend/
    build:
      context: ..
      dockerfile: Dockerfile
    image: zhike-core:latest
    container_name: zhike-core
    command: python -m uvicorn core.main:app --host 0.0.0.0 --port 8010 --workers 1
    # .env 由 scripts/deploy.sh 生成在仓库根，与 compose 文件同级的上一层
    env_file:
      - ../.env
    environment:
      - CS_AGENT_DB=/data/cs_agent.db
      # 知识库与检索索引也放持久卷，否则容器重建会退回镜像内种子
      - CS_AGENT_KB=/data/kb.json
      - CS_AGENT_RETRIEVAL_DB=/data/retrieval.db
      - CS_AGENT_STATIC_DIR=/app/frontend/dist
      - EXECUTOR_URL=http://executor:8020
      - TZ=Asia/Shanghai
    volumes:
      - core_data:/data
    # 镜像以 uid 10001 运行；命名卷首次创建时由 Docker 用镜像内 /data 属主初始化，
    # 若从旧版本（root 运行）升级，先执行一次：
    #   docker run --rm -v zhike_core_data:/data alpine chown -R 10001:10001 /data
    user: "10001:10001"
    ports:
      # 安全默认：仅本机可达（配合 CF Tunnel / 反代）；显式设 ZHIKE_BIND=0.0.0.0 才公网暴露
      - "${ZHIKE_BIND:-127.0.0.1}:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # 资源限额：防止单进程吃满宿主（SQLite + 单 worker，1 CPU / 1GB 足够）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  gateway:
    # 复用 core 构建出的镜像，不重复构建（同一 Dockerfile、同一上下文）
    image: zhike-core:latest
    container_name: zhike-gateway
    command: python gateway/bot.py
    env_file:
      - ../.env
    environment:
      - CORE_BASE_URL=http://core:8010
      - ONEBOT_WS_URL=ws://napcat:3001
      - TZ=Asia/Shanghai
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

  # 电脑执行器：与 core 同机、仅容器网络内可达。
  # 需要授权宿主目录时，在 .env 里设 EXECUTOR_WORKDIR（宿主路径），挂载为 /work。
  executor:
    image: zhike-core:latest
    container_name: zhike-executor
    command: python -m executor.main
    env_file:
      - ../.env
    environment:
      - EXECUTOR_BIND=0.0.0.0
      - EXECUTOR_PORT=8020
      - EXECUTOR_POLICY_PATH=/work/policy.json
      - TZ=Asia/Shanghai
    volumes:
      # 只挂你需要它操作的目录；不要挂 / 或用户主目录
      - "${EXECUTOR_WORKDIR:-./exec_work}:/work"
    # 不发布端口：只有 core 通过容器内网访问
    restart: unless-stopped

volumes:
  core_data:
  napcat_data:

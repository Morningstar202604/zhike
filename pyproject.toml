[project]
name = "zhike"
version = "1.4.1"
description = "Self-hosted personal assistant agent harness: QQ + Web, ReAct loop, RAG, reminders, tiered action permissions, audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi~=0.116",
  "uvicorn[standard]~=0.30",
  "httpx~=0.28",
  "pydantic~=2.11",
  "python-multipart~=0.0.9",
  "nonebot2~=2.5",
  "nonebot-adapter-onebot~=2.4",
  "python-dotenv~=1.1",
  "pypdf~=6.21",
  "python-docx~=1.2",
  "openpyxl>=3.1",
  "cryptography~=50.0",
  "prometheus-client~=0.21",
  "tenacity~=9.0",
  "trafilatura~=2.0",
  "ddgs~=9.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers~=3.0", "numpy~=1.26", "sqlite-vec~=0.1"]
asr = ["faster-whisper~=1.2"]
voice = ["edge-tts~=7.3"]
mcp = ["mcp>=1.0"]
tracing = ["opentelemetry-sdk~=1.27", "opentelemetry-exporter-otlp~=1.27"]
dev = ["pytest~=9.0", "pytest-cov~=7.0", "pytest-asyncio~=1.0", "ruff~=0.17",
       "pip-audit~=2.10", "mypy~=1.14", "types-pyyaml"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "frontend", "node_modules"]

[tool.ruff.lint]
# E9/F63/F7/F82 是语法级错误；F401/F841 是未使用导入/变量；
# B 是 bugbear（可变默认参数、循环变量捕获等真实缺陷）；
# ASYNC 是 async 函数里的阻塞调用（本项目踩过 httpx/文件 IO 阻塞事件循环）。
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B", "ASYNC"]
ignore = [
  "B008",   # FastAPI 的 Depends()/Header() 就是默认值惯用法
  "B904",   # raise ... from 的链式异常：存量代码量大，单独一个 PR 处理
  "ASYNC109",  # 超时参数命名风格
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "ASYNC"]
"scripts/*" = ["B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(frontend|scripts|tests)/"

[tool.coverage.run]
source = ["core"]
omit = ["core/mcp_server.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
